{% extends "base.html" %}
{% block content %}
<h2>Classes</h2>
{% if session.role == 'admin' %}
<form method="post" class="inline card">
  <input name="name" placeholder="Class name (e.g. BSc CS Year 1)" required>
  <input name="section" placeholder="Section">
  <button>Add class</button>
</form>
{% endif %}
<table><tr><th>Name</th><th>Section</th><th>Students</th>{% if session.role == 'admin' %}<th></th>{% endif %}</tr>
{% for c in classes %}<tr><td>{{ c.name }}</td><td>{{ c.section }}</td><td>{{ c.n }}</td>
{% if session.role == 'admin' %}<td><form method="post" action="{{ url_for('delete_class', cid=c.id) }}" onsubmit="return confirm('Delete class and its students?')"><button class="danger">Delete</button></form></td>{% endif %}</tr>{% endfor %}
</table>
{% endblock %}
